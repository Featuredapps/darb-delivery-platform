# Render Blueprint for DARB API — zero-cost preview deployment.
# Only the API service is created here. Database and Redis are external free-tier
# services so Render's 30-day Postgres expiry and ephemeral free Redis do not
# become the source of truth for application data.
services:
  - type: web
    name: darb-api
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/healthz
    buildCommand: >-
      mkdir -p .render-build &&
      unzip -q DARB-source.zip -d .render-build &&
      cp -R backend/src/. .render-build/darb-project/backend/src/ &&
      mkdir -p .render-build/darb-project/backend/prisma/migrations &&
      cp -R backend/prisma/migrations/. .render-build/darb-project/backend/prisma/migrations/ &&
      cd .render-build/darb-project/backend &&
      npm install --no-audit --no-fund &&
      npx prisma generate &&
      npm run build
    startCommand: cd .render-build/darb-project/backend && npx prisma migrate deploy && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: SMS_API_URL
        sync: false
      - key: SMS_API_KEY
        sync: false
