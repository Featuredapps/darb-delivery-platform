# Render Blueprint for DARB backend.
# Free plans are for validation only; they are not production-safe.
databases:
  - name: darb-postgres
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
    databaseName: darb
    user: darb

services:
  - type: keyvalue
    name: darb-redis
    plan: free
    region: frankfurt
    ipAllowList: []

  - type: web
    name: darb-api
    runtime: node
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/healthz
    buildCommand: >-
      mkdir -p .render-build &&
      unzip -q DARB-source.zip -d .render-build &&
      cp -R backend/src/. .render-build/darb-project/backend/src/ &&
      cd .render-build/darb-project/backend &&
      npm install --no-audit --no-fund &&
      npx prisma generate &&
      npm run build
    startCommand: cd .render-build/darb-project/backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: darb-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: darb-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: SMS_API_URL
        sync: false
      - key: SMS_API_KEY
        sync: false
