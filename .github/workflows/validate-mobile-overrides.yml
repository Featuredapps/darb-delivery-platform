name: Validate DARB mobile overrides

on:
  pull_request:
    paths:
      - "mobile-overrides/**"
      - "DARB-source.zip"
      - ".github/workflows/validate-mobile-overrides.yml"
      - ".github/workflows/build-android-release.yml"
  push:
    branches: [main]
    paths:
      - "mobile-overrides/**"
      - "DARB-source.zip"
      - ".github/workflows/validate-mobile-overrides.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Assemble the exact mobile source used by release
        shell: bash
        run: |
          set -euo pipefail
          unzip -q DARB-source.zip -d extracted
          M="$GITHUB_WORKSPACE/extracted/darb-project/mobile"
          cd "$M"
          flutter create --platforms=android --org com.darb --project-name darb --no-pub .
          cd "$GITHUB_WORKSPACE"
          cp mobile-overrides/login_screen.dart "$M/lib/screens/login_screen.dart"
          cp mobile-overrides/main.dart "$M/lib/main.dart"
          cp mobile-overrides/design_system.dart "$M/lib/design_system.dart"
          cp mobile-overrides/localizations.dart "$M/lib/localizations.dart"
          cp mobile-overrides/api.dart "$M/lib/core/api.dart"
          cp mobile-overrides/app_shell.dart "$M/lib/screens/app_shell.dart"
          cp mobile-overrides/admin_screens.dart "$M/lib/screens/admin_screens.dart"
          cp mobile-overrides/customer_screens.dart "$M/lib/screens/customer_screens.dart"
          cp mobile-overrides/peer_delivery_screen.dart "$M/lib/screens/peer_delivery_screen.dart"
          cp mobile-overrides/vendor_screens.dart "$M/lib/screens/vendor_screens.dart"
          cp mobile-overrides/driver_screens.dart "$M/lib/screens/driver_screens.dart"
          cp mobile-overrides/account_screens.dart "$M/lib/screens/account_screens.dart"
          cp mobile-overrides/notifications.dart "$M/lib/notifications.dart"
          cp mobile-overrides/design_system_test.dart "$M/test/widget_test.dart"
          mkdir -p "$M/android/app/src/main/res/drawable"
          cp mobile-overrides/ic_launcher.xml "$M/android/app/src/main/res/drawable/ic_launcher.xml"
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_launcher"|' "$M/android/app/src/main/AndroidManifest.xml"
          cd "$M"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("pubspec.yaml")
          lines=p.read_text().splitlines()
          lines=[line for line in lines if not line.strip().startswith("intl:")]
          dep=next((i for i,line in enumerate(lines) if line.strip()=="dependencies:"),None)
          if dep is None: raise SystemExit("pubspec.yaml dependencies section missing")
          for name, version in [("intl","^0.20.3"),("google_sign_in","^6.2.1"),("geolocator","^13.0.2"),("url_launcher","^6.3.1"),("firebase_core","^3.8.1"),("firebase_messaging","^15.1.6")]:
              if not any(line.strip().startswith(name + ":") for line in lines):
                  dep += 1
                  lines.insert(dep, f"  {name}: {version}")
          p.write_text("\n".join(lines)+"\n")
          PY
          flutter pub get
      - name: Analyze all mobile Dart sources
        working-directory: extracted/darb-project/mobile
        run: flutter analyze lib --no-pub --no-fatal-infos --no-fatal-warnings
      - name: Build Android debug APK
        working-directory: extracted/darb-project/mobile
        run: flutter build apk --debug --no-pub
      - name: Run Flutter tests
        working-directory: extracted/darb-project/mobile
        shell: bash
        run: |
          set -euo pipefail
          if find test -type f -name '*_test.dart' -print -quit 2>/dev/null | grep -q .; then
            flutter test --no-pub
          else
            echo "::notice::No Flutter test files supplied by the source archive."
          fi
