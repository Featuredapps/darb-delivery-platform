name: Build signed DARB Android release
on:
  push:
    branches: [main, feat/darb-localized-login-google, fix/google-oauth-release-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - name: Validate signing secrets
        env:
          KS: ${{ secrets.DARB_KEYSTORE_BASE64 }}
          SP: ${{ secrets.DARB_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.DARB_KEY_ALIAS }}
          KP: ${{ secrets.DARB_KEY_PASSWORD }}
        run: test -n "$KS" && test -n "$SP" && test -n "$AL" && test -n "$KP"
      - name: Extract source and apply overrides
        run: |
          set -euo pipefail
          unzip -q DARB-source.zip -d extracted
          M=extracted/darb-project/mobile
          D="$M/lib/screens/app_shell.dart"
          if grep -Fq "cityId:cityId))));}}" "$D"; then sed -i "s/cityId:cityId))));}}/cityId:cityId)))));}}/" "$D"; fi
          cp mobile-overrides/login_screen.dart "$M/lib/screens/login_screen.dart"
          cp mobile-overrides/main.dart "$M/lib/main.dart"
          cp mobile-overrides/localizations.dart "$M/lib/localizations.dart"
          cp mobile-overrides/api.dart "$M/lib/core/api.dart"
          cp mobile-overrides/app_shell.dart "$M/lib/screens/app_shell.dart"
          cp mobile-overrides/notifications.dart "$M/lib/notifications.dart"
          bash backend-overrides/prepare-source.sh extracted/darb-project
          mkdir -p "$M/android/app/src/main/res/drawable"
          cp mobile-overrides/ic_launcher.xml "$M/android/app/src/main/res/drawable/ic_launcher.xml"
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_launcher"|' "$M/android/app/src/main/AndroidManifest.xml"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create Android and configure signing
        working-directory: extracted/darb-project/mobile
        env:
          KS: ${{ secrets.DARB_KEYSTORE_BASE64 }}
          SP: ${{ secrets.DARB_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.DARB_KEY_ALIAS }}
          KP: ${{ secrets.DARB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.darb --project-name darb .
          echo "$KS" | base64 --decode > android/app/darb-release.jks
          keytool -list -keystore android/app/darb-release.jks -storepass "$SP" -alias "$AL" >/dev/null
          cat > android/key.properties <<EOF
          storePassword=$SP
          keyPassword=$KP
          keyAlias=$AL
          storeFile=darb-release.jks
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p=Path("android/app/build.gradle.kts")
          s=p.read_text()
          s="import java.util.Properties\nimport java.io.FileInputStream\n"+s
          s=s.replace("android {", 'val signingProps = Properties()\nval signingFile = rootProject.file("key.properties")\nsigningProps.load(FileInputStream(signingFile))\n\nandroid {',1)
          cfg='''signingConfigs {
              create("release") {
                  keyAlias = signingProps["keyAlias"] as String
                  keyPassword = signingProps["keyPassword"] as String
                  storeFile = file(signingProps["storeFile"] as String)
                  storePassword = signingProps["storePassword"] as String
              }
          }
          '''
          s=s.replace("    buildTypes {", "    "+cfg+"    buildTypes {",1)
          s=s.replace('signingConfig = signingConfigs.getByName("debug")','signingConfig = signingConfigs.getByName("release")')
          p.write_text(s)
          PY
          python3 - <<'PY'
          from pathlib import Path
          p=Path("pubspec.yaml"); s=p.read_text()
          import re
          s=re.sub(r"^  intl:.*$", "  intl: ^0.20.3", s, count=1, flags=re.M)
          if "google_sign_in:" not in s:
              s=s.replace("  flutter_localizations:\n", "  google_sign_in: ^6.2.1\n  flutter_localizations:\n",1)
          p.write_text(s)
          PY
          flutter pub get
      - name: Analyze and build
        working-directory: extracted/darb-project/mobile
        env:
          API: https://darb-api-yapv.onrender.com/api/v1
          GOOGLE_CLIENT: 1005839784892-3b1sctr2c32hfa6ssq17nunfhn2d9pji.apps.googleusercontent.com
        run: |
          set -euo pipefail
          flutter analyze lib --no-pub --no-fatal-infos --no-fatal-warnings
          flutter build apk --release --build-number="$GITHUB_RUN_NUMBER" --dart-define=API_BASE_URL="$API" --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_CLIENT"
          flutter build appbundle --release --build-number="$GITHUB_RUN_NUMBER" --dart-define=API_BASE_URL="$API" --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_CLIENT"
      - name: Verify signing and package
        working-directory: extracted/darb-project/mobile
        env:
          SP: ${{ secrets.DARB_KEYSTORE_PASSWORD }}
          AL: ${{ secrets.DARB_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          test -s "$APK" && test -s "$AAB"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SIGNER="$(find "$SDK/build-tools" -type f -name apksigner | sort -V | tail -1)"
          ANALYZER="$(find "$SDK" -type f -name apkanalyzer | sort -V | tail -1)"
          "$SIGNER" verify --verbose "$APK"
          jarsigner -verify "$AAB"
          KEY_SHA="$(keytool -list -v -keystore android/app/darb-release.jks -alias "$AL" -storepass "$SP" | awk -F': ' '/SHA1:/{print $2;exit}' | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          APK_SHA="$( "$SIGNER" verify --print-certs "$APK" | awk -F': ' '/certificate SHA-1 digest:/{print $2;exit}' | tr -d ': ' | tr '[:upper:]' '[:lower:]')"
          APP="$( "$ANALYZER" manifest application-id "$APK")"
          test "$APP" = com.darb.darb
          test "$KEY_SHA" = "$APK_SHA"
          echo "Verified appId=$APP SHA1=$APK_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: darb-android-signed-release
          path: |
            extracted/darb-project/mobile/build/app/outputs/flutter-apk/app-release.apk
            extracted/darb-project/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
