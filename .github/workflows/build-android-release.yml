name: Validate Android source (APK disabled)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Extract source and apply overrides
        run: |
          set -euo pipefail
          unzip -q DARB-source.zip -d extracted
          ROOT="$GITHUB_WORKSPACE"
          M="$ROOT/extracted/darb-project/mobile"
          cd "$M"
          flutter create --platforms=android --org com.darb --project-name darb --no-pub .
          D="$M/lib/screens/app_shell.dart"
          if grep -Fq "cityId:cityId))));}}" "$D"; then sed -i "s/cityId:cityId))));}}/cityId:cityId)))));}}/" "$D"; fi
          cp "$ROOT/mobile-overrides/login_screen.dart" "$M/lib/screens/login_screen.dart"
          cp "$ROOT/mobile-overrides/main.dart" "$M/lib/main.dart"
          cp "$ROOT/mobile-overrides/localizations.dart" "$M/lib/localizations.dart"
          cp "$ROOT/mobile-overrides/api.dart" "$M/lib/core/api.dart"
          cp "$ROOT/mobile-overrides/app_shell.dart" "$M/lib/screens/app_shell.dart"
          cp "$ROOT/mobile-overrides/notifications.dart" "$M/lib/notifications.dart"
          mkdir -p "$M/android/app/src/main/res/drawable"
          cp "$ROOT/mobile-overrides/ic_launcher.xml" "$M/android/app/src/main/res/drawable/ic_launcher.xml"
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_launcher"|' "$M/android/app/src/main/AndroidManifest.xml"
          python3 - "$M/pubspec.yaml" "$M/android/app/src/main/AndroidManifest.xml" <<'PY'
          from pathlib import Path
          import sys
          pubspec, manifest = map(Path, sys.argv[1:])
          lines = pubspec.read_text().splitlines()
          deps = ["  geolocator: ^13.0.2", "  url_launcher: ^6.3.1", "  firebase_core: ^3.8.1", "  firebase_messaging: ^15.1.6"]
          dep_index = next((i for i, line in enumerate(lines) if line.strip() == "dependencies:"), None)
          if dep_index is None: raise SystemExit("dependencies section missing")
          for dep in deps:
              name = dep.split(":")[0].strip()
              if not any(line.strip().startswith(name + ":") for line in lines):
                  dep_index += 1
                  lines.insert(dep_index, dep)
          pubspec.write_text("\\n".join(lines) + "\\n")
          m = manifest.read_text()
          permissions = ["ACCESS_FINE_LOCATION", "ACCESS_COARSE_LOCATION", "POST_NOTIFICATIONS"]
          for p in permissions:
              tag = f'<uses-permission android:name="android.permission.{p}" />'
              if tag not in m:
                  internet = '<uses-permission android:name="android.permission.INTERNET" />'
                  if internet not in m: raise SystemExit("INTERNET permission anchor missing")
                  m = m.replace(internet, internet + "\\n    " + tag)
          manifest.write_text(m)
          PY
      - name: Normalize dependencies and resolve packages
        working-directory: extracted/darb-project/mobile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("pubspec.yaml")
          lines=p.read_text().splitlines()
          lines=[line for line in lines if not line.strip().startswith("intl:")]
          dep=next((i for i,line in enumerate(lines) if line.strip()=="dependencies:"),None)
          if dep is None:
              raise SystemExit("pubspec.yaml dependencies section missing")
          lines.insert(dep+1,"  intl: ^0.20.3")
          if not any(line.strip().startswith("google_sign_in:") for line in lines):
              lines.insert(dep+2,"  google_sign_in: ^6.2.1")
          p.write_text("\n".join(lines)+"\n")
          PY
          flutter pub get
      - name: Analyze and test (APK build disabled)
        working-directory: extracted/darb-project/mobile
        run: |
          set -euo pipefail
          flutter analyze lib --no-pub --no-fatal-infos --no-fatal-warnings
          flutter test --no-pub
