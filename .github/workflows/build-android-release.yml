name: Build signed DARB Android release

on:
  push:
    branches:
      - feat/darb-localized-login-google
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Production HTTPS API base URL, including /api/v1 and no trailing slash"
        required: true
        default: https://darb-api-yapv.onrender.com/api/v1
        type: string

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate signing secrets
        shell: bash
        env:
          DARB_KEYSTORE_BASE64: ${{ secrets.DARB_KEYSTORE_BASE64 }}
          DARB_KEYSTORE_PASSWORD: ${{ secrets.DARB_KEYSTORE_PASSWORD }}
          DARB_KEY_ALIAS: ${{ secrets.DARB_KEY_ALIAS }}
          DARB_KEY_PASSWORD: ${{ secrets.DARB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in DARB_KEYSTORE_BASE64 DARB_KEYSTORE_PASSWORD DARB_KEY_ALIAS DARB_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Extract and repair source
        shell: bash
        run: |
          set -euo pipefail
          test -s DARB-source.zip
          unzip -q DARB-source.zip -d extracted
          dart_file="extracted/darb-project/mobile/lib/screens/app_shell.dart"
          if grep -Fq "cityId:cityId))));}}" "$dart_file"; then
            sed -i "s/cityId:cityId))));}}/cityId:cityId)))));}}/" "$dart_file"
          fi
          if grep -Fq "cityId:cityId))));}}" "$dart_file"; then
            echo "::error::Vendor navigation syntax patch did not apply"
            exit 1
          fi
          # Apply the reviewed login UI and launcher artwork overrides.
          cp mobile-overrides/login_screen.dart extracted/darb-project/mobile/lib/screens/login_screen.dart
          cp mobile-overrides/main.dart extracted/darb-project/mobile/lib/main.dart
          cp mobile-overrides/localizations.dart extracted/darb-project/mobile/lib/localizations.dart
          cp mobile-overrides/api.dart extracted/darb-project/mobile/lib/core/api.dart
          cp mobile-overrides/app_shell.dart extracted/darb-project/mobile/lib/screens/app_shell.dart
          cp mobile-overrides/notifications.dart extracted/darb-project/mobile/lib/notifications.dart
          bash backend-overrides/prepare-source.sh extracted/darb-project
          mkdir -p extracted/darb-project/mobile/android/app/src/main/res/drawable
          cp mobile-overrides/ic_launcher.xml extracted/darb-project/mobile/android/app/src/main/res/drawable/ic_launcher.xml
          sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@drawable/ic_launcher"|' extracted/darb-project/mobile/android/app/src/main/AndroidManifest.xml

      - name: Set up Java 17 and Flutter
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project and signing
        working-directory: extracted/darb-project/mobile
        shell: bash
        env:
          DARB_KEYSTORE_BASE64: ${{ secrets.DARB_KEYSTORE_BASE64 }}
          DARB_KEYSTORE_PASSWORD: ${{ secrets.DARB_KEYSTORE_PASSWORD }}
          DARB_KEY_ALIAS: ${{ secrets.DARB_KEY_ALIAS }}
          DARB_KEY_PASSWORD: ${{ secrets.DARB_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          s = p.read_text()
          p.write_text(s.replace("intl: ^0.19.0", "intl: ^0.20.3"))
          PY
          main_activity="$(find android/app/src/main -type f 2>/dev/null | grep -E 'MainActivity[.]kt$|MainActivity[.]java$' | head -n 1 || true)"
          if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ] || [ -z "$main_activity" ] || [ ! -f android/gradlew ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/darb-AndroidManifest.xml
            flutter create --platforms=android --project-name darb --org com.darb .
            cp /tmp/darb-AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi
          mkdir -p android/app
          printf '%s' "$DARB_KEYSTORE_BASE64" | base64 --decode > android/app/darb-release.jks
          cat > android/key.properties <<EOF
          storePassword=$DARB_KEYSTORE_PASSWORD
          keyPassword=$DARB_KEY_PASSWORD
          keyAlias=$DARB_KEY_ALIAS
          storeFile=darb-release.jks
          EOF
          chmod 600 android/key.properties android/app/darb-release.jks
          python3 - <<'PY'
          from pathlib import Path
          import re

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")

          if groovy.exists():
              p = groovy
              s = p.read_text()
              if "signingConfigs {" not in s:
                  block = '''
          def keystoreProperties = new Properties()
          def keystorePropertiesFile = rootProject.file('key.properties')
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
          }

          android {
              signingConfigs {
                  release {
                      keyAlias keystoreProperties['keyAlias']
                      keyPassword keystoreProperties['keyPassword']
                      storeFile file(keystoreProperties['storeFile'])
                      storePassword keystoreProperties['storePassword']
                  }
              }
          '''
                  s = s.replace("android {", block, 1)
              m = re.search(r"buildTypes\s*\{\s*release\s*\{", s)
              if not m:
                  raise SystemExit("Could not locate Groovy release buildType")
              pos = m.end()
              if "signingConfig signingConfigs.release" not in s:
                  s = s[:pos] + "\n            signingConfig signingConfigs.release" + s[pos:]
              p.write_text(s)
          elif kotlin.exists():
              p = kotlin
              s = p.read_text()
              imports = "import java.util.Properties\nimport java.io.FileInputStream\n"
              if "import java.util.Properties" not in s:
                  s = imports + s
              if 'create("release")' not in s:
                  block = '''
          val keystoreProperties = Properties()
          val keystorePropertiesFile = rootProject.file("key.properties")
          if (keystorePropertiesFile.exists()) {
              keystoreProperties.load(FileInputStream(keystorePropertiesFile))
          }

          android {
              signingConfigs {
                  create("release") {
                      keyAlias = keystoreProperties["keyAlias"] as String
                      keyPassword = keystoreProperties["keyPassword"] as String
                      storeFile = file(keystoreProperties["storeFile"] as String)
                      storePassword = keystoreProperties["storePassword"] as String
                  }
              }
          '''
                  s = s.replace("android {", block, 1)
              m = re.search(r'buildTypes\s*\{\s*release\s*\{', s)
              if not m:
                  raise SystemExit("Could not locate Kotlin release buildType")
              pos = m.end()
              if 'signingConfig = signingConfigs.getByName("release")' not in s:
                  s = s[:pos] + '\n            signingConfig = signingConfigs.getByName("release")' + s[pos:]
              p.write_text(s)
          else:
              raise SystemExit("No Android app Gradle build file found")
          PY
          # Android Lint 8 currently crashes in the Google Sign-In Android dependency
          # (NoSuchMethodError in CommentDetector). Flutter analysis remains mandatory above;
          # disable only the broken Gradle vital-lint task so release packaging can complete.
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          if root.exists():
              s = root.read_text()
              marker = "tasks.configureEach {"
              block = """
          subprojects {
              tasks.configureEach {
                  if (name == "lintVitalAnalyzeRelease") {
                      enabled = false
                  }
              }
          }
          """
              if marker not in s or 'name == "lintVitalAnalyzeRelease"' not in s:
                  root.write_text(s + "\n" + block)
          PY
          test -s android/app/darb-release.jks
          if [ -f android/app/build.gradle.kts ]; then
            grep -q 'signingConfig = signingConfigs.getByName("release")' android/app/build.gradle.kts
          else
            grep -q "signingConfig signingConfigs.release" android/app/build.gradle
          fi
          python3 - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          s = p.read_text()
          if "google_sign_in:" not in s:
              s = s.replace("  flutter_localizations:\n    sdk: flutter\n", "  flutter_localizations:\n    sdk: flutter\n  google_sign_in: ^6.2.1\n")
          p.write_text(s)
          PY
          flutter pub get

      - name: Analyze and build signed APK and AAB
        working-directory: extracted/darb-project/mobile
        env:
          DARB_API_BASE_URL: ${{ inputs.api_base_url || 'https://darb-api-yapv.onrender.com/api/v1' }}
          GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [[ "$DARB_API_BASE_URL" != https://* || "$DARB_API_BASE_URL" == */ ]]; then
            echo "::error::A production HTTPS API URL is required; refusing to package the emulator fallback URL."
            exit 1
          fi
          flutter analyze lib --no-pub --no-fatal-infos --no-fatal-warnings
          flutter build apk --release --dart-define=API_BASE_URL="$DARB_API_BASE_URL" --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"
          flutter build appbundle --release --dart-define=API_BASE_URL="$DARB_API_BASE_URL" --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID" --dart-define=FIREBASE_API_KEY="$FIREBASE_API_KEY" --dart-define=FIREBASE_APP_ID="$FIREBASE_APP_ID" --dart-define=FIREBASE_MESSAGING_SENDER_ID="$FIREBASE_MESSAGING_SENDER_ID" --dart-define=FIREBASE_PROJECT_ID="$FIREBASE_PROJECT_ID"

      - name: Verify release outputs
        working-directory: extracted/darb-project/mobile
        run: |
          set -euo pipefail
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab
          APKSIGNER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::error::Android SDK apksigner was not found in build-tools"
            exit 1
          fi
          "$APKSIGNER" verify --verbose build/app/outputs/flutter-apk/app-release.apk
          jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab

      - name: Upload signed Android release
        uses: actions/upload-artifact@v4
        with:
          name: darb-android-signed-release
          path: |
            extracted/darb-project/mobile/build/app/outputs/flutter-apk/app-release.apk
            extracted/darb-project/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

