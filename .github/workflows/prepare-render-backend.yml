name: Prepare DARB backend source

on:
  workflow_dispatch:
  push:
    branches: [render-deploy]

permissions:
  contents: write

jobs:
  extract-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment branch
        uses: actions/checkout@v4
        with:
          ref: render-deploy
          fetch-depth: 0

      - name: Extract backend from reviewed source archive
        shell: bash
        run: |
          set -euxo pipefail
          echo "Repository files:"
          ls -la
          test -f DARB-source.zip
          unzip -t DARB-source.zip | tail -n 2
          mkdir -p /tmp/darb-source
          unzip -q DARB-source.zip -d /tmp/darb-source
          echo "Archive contents containing backend package.json:"
          find /tmp/darb-source -path '*/backend/package.json' -print
          PACKAGE_JSON="$(find /tmp/darb-source -path '*/backend/package.json' -print -quit)"
          test -n "$PACKAGE_JSON"
          SOURCE="$(dirname "$PACKAGE_JSON")"
          test -f "$SOURCE/prisma/schema.prisma"
          rm -rf backend
          mkdir -p backend
          cp -a "$SOURCE/." backend/
          rm -rf backend/node_modules backend/dist backend/.gradle backend/.idea backend/.kotlin
          rm -f backend/.env
          test -f backend/package.json
          test -f backend/prisma/schema.prisma
      - name: Install, generate Prisma client, and compile NestJS
        working-directory: backend
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/darb_build
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --ignore-scripts
          fi
          npm ci
          npx prisma validate
          npm run db:generate
          npm run build

      - name: Commit extracted backend only after successful build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend
          if git diff --cached --quiet; then
            echo "Backend source is already up to date."
            exit 0
          fi
          git commit -m "chore: extract and validate backend source"
          git push origin HEAD:render-deploy
