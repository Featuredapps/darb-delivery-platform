name: Inspect Android embedding

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract and inspect source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q DARB-source.zip -d extracted
          python3 - <<'PY'
          from pathlib import Path
          import zipfile

          root = Path("extracted")
          needles = (
              "io.flutter.app.FlutterActivity",
              "io.flutter.app.FlutterApplication",
              "PluginRegistry.Registrar",
              "registerWith(Registrar",
              "GeneratedPluginRegistrant.registerWith(this)",
              "flutterEmbedding",
          )
          candidates = []
          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              rel = p.relative_to(root).as_posix()
              if (
                  p.name in {"AndroidManifest.xml", "MainActivity.kt", "MainActivity.java",
                             "build.gradle", "build.gradle.kts", "settings.gradle",
                             "settings.gradle.kts", "gradle.properties", "pubspec.yaml"}
                  or "android/" in rel and p.suffix in {".kt", ".java", ".xml", ".gradle", ".kts"}
              ):
                  candidates.append(p)

          print("=== ANDROID FILE INVENTORY ===")
          for p in sorted(candidates):
              print(p.relative_to(root).as_posix())

          print("\\n=== LEGACY EMBEDDING / REGISTRATION REFERENCES ===")
          hits = 0
          for p in sorted(candidates):
              try:
                  lines = p.read_text(errors="replace").splitlines()
              except Exception:
                  continue
              for number, line in enumerate(lines, 1):
                  if any(n in line for n in needles):
                      print(f"{p.relative_to(root).as_posix()}:{number}: {line.strip()}")
                      hits += 1
          if not hits:
              print("No legacy embedding strings found in inspected Android files.")

          print("\\n=== KEY ANDROID CONFIGURATION FILES ===")
          key_names = {"AndroidManifest.xml", "MainActivity.kt", "MainActivity.java",
                       "build.gradle", "build.gradle.kts", "settings.gradle",
                       "settings.gradle.kts", "gradle.properties", "pubspec.yaml"}
          for p in sorted(root.rglob("*")):
              if p.is_file() and p.name in key_names and ("android/" in p.as_posix() or p.name == "pubspec.yaml"):
                  print(f"\\n--- {p.relative_to(root).as_posix()} ---")
                  try:
                      lines = p.read_text(errors="replace").splitlines()
                      for i, line in enumerate(lines[:220], 1):
                          print(f"{i:4}: {line}")
                  except Exception as e:
                      print(f"Unable to read: {e}")
          PY

      - name: Save inspection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: darb-android-inspection
          path: |
            extracted
          retention-days: 7
