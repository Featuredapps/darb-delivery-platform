name: Validate DARB backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'DARB-source.zip'
      - 'render.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'DARB-source.zip'
      - 'render.yaml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract backend and apply repository patches
        shell: bash
        run: |
          set -euo pipefail
          unzip -q DARB-source.zip -d extracted
          cp -R backend/src/. extracted/darb-project/backend/src/

      - name: Install dependencies
        working-directory: extracted/darb-project/backend
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: extracted/darb-project/backend
        run: npx prisma generate

      - name: Build backend
        working-directory: extracted/darb-project/backend
        run: npm run build

      - name: Run backend tests
        working-directory: extracted/darb-project/backend
        run: npm test -- --runInBand
