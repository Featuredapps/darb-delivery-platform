name: Validate DARB backend

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'DARB-source.zip'
      - 'render.yaml'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'DARB-source.zip'
      - 'render.yaml'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract backend and apply repository patches
        shell: bash
        run: |
          set -euo pipefail
          unzip -q DARB-source.zip -d extracted
          cp -R backend/src/. extracted/darb-project/backend/src/

      - name: Install dependencies
        working-directory: extracted/darb-project/backend
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: extracted/darb-project/backend
        run: npx prisma generate

      - name: Generate initial Prisma migration for review
        working-directory: extracted/darb-project/backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../migration-review
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > ../../migration-review/001_initial_schema.sql
          cp prisma/schema.prisma ../../migration-review/schema.prisma
          cp prisma/sql/002_postgis_indexes.sql ../../migration-review/002_postgis_indexes.sql

      - name: Upload migration review artifact
        uses: actions/upload-artifact@v4
        with:
          name: darb-prisma-migration-review
          path: extracted/migration-review/
          if-no-files-found: error
          retention-days: 7

      - name: Build backend
        working-directory: extracted/darb-project/backend
        run: npm run build

      - name: Run backend tests
        working-directory: extracted/darb-project/backend
        run: npm test -- --runInBand
