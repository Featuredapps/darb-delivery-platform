name: Validate DARB source archive

on:
  push:
    paths:
      - "DARB-source.zip"
      - ".github/workflows/validate-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s DARB-source.zip
          unzip -q DARB-source.zip -d extracted
          dart_file="extracted/darb-project/mobile/lib/screens/app_shell.dart"
          if grep -Fq "cityId:cityId))));}}" "$dart_file"; then
            sed -i "s/cityId:cityId))));}}/cityId:cityId)))));}}/" "$dart_file"
          fi
          if grep -Fq "cityId:cityId))));}}" "$dart_file"; then
            echo "::error::Vendor navigation syntax patch did not apply"
            exit 1
          fi
          echo "Applied Dart syntax repair to vendor navigation."
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort | head -250

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ""

      - name: Build every Node package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find extracted -name package.json -not -path '*/node_modules/*' -not -path '*/.dart_tool/*' | sort)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No package.json found in source archive"
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            dir="$(dirname "$manifest")"
            echo "::group::Node package: $dir"
            cd "$GITHUB_WORKSPACE/$dir"
            npm install --no-audit --no-fund
            if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
              npm run build
            else
              echo "No build script; checking package metadata only."
            fi
            echo "::endgroup::"
          done

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Repair Android scaffold, analyze, and build Flutter app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find extracted -name pubspec.yaml | sort)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No pubspec.yaml found in source archive"
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            dir="$(dirname "$manifest")"
            echo "::group::Flutter app: $dir"
            cd "$GITHUB_WORKSPACE/$dir"

            # Resolve the SDK-pinned intl constraint before flutter create runs pub resolution.
            python3 - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          s = p.read_text()
          p.write_text(s.replace("intl: ^0.19.0", "intl: ^0.20.3"))
          PY

            # The supplied archive contains only a partial Android directory.
            # Preserve its app manifest while regenerating the missing v2 Android platform scaffold.
            main_activity="$(find android/app/src/main -type f 2>/dev/null | grep -E 'MainActivity[.]kt$|MainActivity[.]java$' | head -n 1 || true)"
            if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ] ||
               [ -z "$main_activity" ] || [ ! -f android/gradlew ]; then
              echo "Incomplete Android scaffold detected; regenerating with Flutter stable."
              cp android/app/src/main/AndroidManifest.xml /tmp/darb-AndroidManifest.xml
              flutter create --platforms=android --project-name darb --org com.darb .
              cp /tmp/darb-AndroidManifest.xml android/app/src/main/AndroidManifest.xml
            fi

            # Fail before compilation if the Android project is still incomplete or uses old embedding.
            test -f android/gradlew
            test -f android/app/build.gradle -o -f android/app/build.gradle.kts
            main_activity="$(find android/app/src/main -type f | grep -E 'MainActivity[.]kt$|MainActivity[.]java$' | head -n 1 || true)"
            test -n "$main_activity"
            grep -Fq 'io.flutter.embedding.android.FlutterActivity' "$main_activity"
            grep -q 'android:name="flutterEmbedding" android:value="2"' android/app/src/main/AndroidManifest.xml

            flutter pub get
            # Infos and warnings are reported but do not suppress compiler/build errors.
            if ! flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings; then
              echo "::group::Dart syntax context: app_shell.dart lines 25-33"
              nl -ba lib/screens/app_shell.dart | sed -n '25,33p' | fold -w 160
              echo "::endgroup::"
              exit 1
            fi
            flutter build apk --debug
            echo "::endgroup::"
          done

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: darb-debug-apk
          path: extracted/**/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Package corrected source archive
        run: |
          set -euo pipefail
          cd extracted
          zip -qr "$GITHUB_WORKSPACE/DARB-source-fixed.zip" darb-project \
            -x '*/node_modules/*' '*/.dart_tool/*' '*/build/*'

      - name: Upload corrected source archive
        uses: actions/upload-artifact@v4
        with:
          name: darb-source-fixed
          path: DARB-source-fixed.zip
          if-no-files-found: error
          retention-days: 30
