name: Validate DARB source archive

on:
  push:
    paths:
      - "DARB-source.zip"
      - ".github/workflows/validate-source.yml"
      - ".github/workflows/build-android-release.yml"
      - "mobile-overrides/**"
      - "backend-overrides/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s DARB-source.zip
          unzip -q DARB-source.zip -d extracted
          dart_file="extracted/darb-project/mobile/lib/screens/app_shell.dart"
          if grep -Fq "cityId:cityId))));}}" "$dart_file"; then
            sed -i "s/cityId:cityId))));}}/cityId:cityId)))));}}/" "$dart_file"
          fi
          if grep -Fq "cityId:cityId))));}}" "$dart_file"; then
            echo "::error::Vendor navigation syntax patch did not apply"
            exit 1
          fi
          echo "Applied Dart syntax repair to vendor navigation."
          python3 - <<'PY'
          from pathlib import Path
          p = Path("extracted/darb-project/mobile/lib/screens/app_shell.dart")
          s = p.read_text()
          old = "    final city = widget.kind == 'drivers' ? row['city']?['code']?.toString() ?? '' : '';"
          new = "    final cityData = row['city'];\n    final city = widget.kind == 'drivers' && cityData is Map ? cityData['code']?.toString() ?? '' : '';"
          p.write_text(s.replace(old, new))
          PY
          cp mobile-overrides/api.dart extracted/darb-project/mobile/lib/core/api.dart
          cp mobile-overrides/login_screen.dart extracted/darb-project/mobile/lib/screens/login_screen.dart
          cp mobile-overrides/main.dart extracted/darb-project/mobile/lib/main.dart
          cp mobile-overrides/design_system.dart extracted/darb-project/mobile/lib/design_system.dart
          cp mobile-overrides/localizations.dart extracted/darb-project/mobile/lib/localizations.dart
          mkdir -p extracted/darb-project/backend/src/modules/orders
          mkdir -p extracted/darb-project/backend/src/modules/notifications
          cp backend-overrides/orders.service.spec.ts extracted/darb-project/backend/src/modules/orders/orders.service.spec.ts
          cp backend-overrides/orders.service.ts extracted/darb-project/backend/src/modules/orders/orders.service.ts
          cp backend-overrides/sms.providers.ts extracted/darb-project/backend/src/modules/auth/sms/sms.providers.ts
          cp backend-overrides/auth.service.ts extracted/darb-project/backend/src/modules/auth/auth.service.ts
          cp backend-overrides/auth.controller.ts extracted/darb-project/backend/src/modules/auth/auth.controller.ts
          cp backend-overrides/otp.service.ts extracted/darb-project/backend/src/modules/auth/otp.service.ts
          cp backend-overrides/otp.service.spec.ts extracted/darb-project/backend/src/modules/auth/otp.service.spec.ts
          cp backend-overrides/auth.service.spec.ts extracted/darb-project/backend/src/modules/auth/auth.service.spec.ts
          cp backend-overrides/orders.tracking.service.spec.ts extracted/darb-project/backend/src/modules/orders/orders.tracking.service.spec.ts
          cp backend-overrides/driver-location.service.spec.ts extracted/darb-project/backend/src/modules/drivers/driver-location.service.spec.ts
          cp backend-overrides/notifications.service.spec.ts extracted/darb-project/backend/src/modules/notifications/notifications.service.spec.ts
          cp backend-overrides/admin.controller.ts extracted/darb-project/backend/src/modules/admin/admin.controller.ts
          cp backend-overrides/vendors.service.ts extracted/darb-project/backend/src/modules/vendors/vendors.service.ts
          cp backend-overrides/vendor-application.dto.ts extracted/darb-project/backend/src/modules/vendors/vendor-application.dto.ts
          cp backend-overrides/addresses.service.ts extracted/darb-project/backend/src/modules/addresses/addresses.service.ts
          cp backend-overrides/addresses.controller.ts extracted/darb-project/backend/src/modules/addresses/addresses.controller.ts
          cp backend-overrides/drivers.service.ts extracted/darb-project/backend/src/modules/drivers/drivers.service.ts
          cp backend-overrides/drivers.module.ts extracted/darb-project/backend/src/modules/drivers/drivers.module.ts
          cp backend-overrides/driver-location.controller.ts extracted/darb-project/backend/src/modules/drivers/driver-location.controller.ts
          cp backend-overrides/driver-location.service.ts extracted/darb-project/backend/src/modules/drivers/driver-location.service.ts
          cp backend-overrides/orders.module.ts extracted/darb-project/backend/src/modules/orders/orders.module.ts
          cp backend-overrides/orders.tracking.controller.ts extracted/darb-project/backend/src/modules/orders/orders.tracking.controller.ts
          cp backend-overrides/orders.tracking.service.ts extracted/darb-project/backend/src/modules/orders/orders.tracking.service.ts
          mkdir -p extracted/darb-project/backend/src/modules/notifications extracted/darb-project/backend/src/modules/health
          cp backend/src/modules/health/* extracted/darb-project/backend/src/modules/health/
          cp backend-overrides/notifications.service.ts extracted/darb-project/backend/src/modules/notifications/notifications.service.ts
          cp backend-overrides/notifications.controller.ts extracted/darb-project/backend/src/modules/notifications/notifications.controller.ts
          cp backend-overrides/notifications.module.ts extracted/darb-project/backend/src/modules/notifications/notifications.module.ts
          cp backend-overrides/orders.controller.ts extracted/darb-project/backend/src/modules/orders/orders.controller.ts
          cp backend-overrides/app.module.ts extracted/darb-project/backend/src/app.module.ts
          mkdir -p extracted/darb-project/backend/prisma/migrations/20261117170000_firebase_devices
          cp backend-overrides/firebase-devices.migration.sql extracted/darb-project/backend/prisma/migrations/20261117170000_firebase_devices/migration.sql
          mkdir -p extracted/darb-project/backend/prisma/migrations/20261117180000_seed_syrian_cities
          cp backend-overrides/syrian-cities.migration.sql extracted/darb-project/backend/prisma/migrations/20261117180000_seed_syrian_cities/migration.sql
          cp mobile-overrides/app_shell.dart extracted/darb-project/mobile/lib/screens/app_shell.dart
          cp mobile-overrides/notifications.dart extracted/darb-project/mobile/lib/notifications.dart
          mkdir -p extracted/darb-project/backend/prisma/migrations/20261117160000_google_accounts
          cp backend-overrides/google-accounts.migration.sql extracted/darb-project/backend/prisma/migrations/20261117160000_google_accounts/migration.sql
          cp backend-overrides/schema.prisma extracted/darb-project/backend/prisma/schema.prisma
          mkdir -p extracted/darb-project/backend/prisma/migrations/20261118195000_peer_delivery_pickup_coordinates
          cp backend-overrides/pickup-coordinates.migration.sql extracted/darb-project/backend/prisma/migrations/20261118195000_peer_delivery_pickup_coordinates/migration.sql
          bash backend-overrides/prepare-source.sh extracted/darb-project
          echo "Applied backend order tests and MsgPlus diagnostics."
          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort | head -250

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: ""

      - name: Build every Node package
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find extracted -name package.json -not -path '*/node_modules/*' -not -path '*/.dart_tool/*' | sort)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No package.json found in source archive"
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            dir="$(dirname "$manifest")"
            echo "::group::Node package: $dir"
            cd "$GITHUB_WORKSPACE/$dir"
            npm install --no-audit --no-fund
            if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
              npm test -- --runInBand
            fi
            if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
              npm run build
            else
              echo "No build script; checking package metadata only."
            fi
            echo "::endgroup::"
          done

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare stable Android debug signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Restore stable Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: darb-android-debug-keystore-v1

      - name: Repair Android scaffold, analyze, and build Flutter app
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t manifests < <(find extracted -name pubspec.yaml | sort)
          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::No pubspec.yaml found in source archive"
            exit 1
          fi
          for manifest in "${manifests[@]}"; do
            dir="$(dirname "$manifest")"
            echo "::group::Flutter app: $dir"
            cd "$GITHUB_WORKSPACE/$dir"

            python3 - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          s = p.read_text()
          p.write_text(s.replace("intl: ^0.19.0", "intl: ^0.20.3"))
          PY

            main_activity="$(find android/app/src/main -type f 2>/dev/null | grep -E 'MainActivity[.]kt$|MainActivity[.]java$' | head -n 1 || true)"
            if [ ! -f android/app/build.gradle ] && [ ! -f android/app/build.gradle.kts ] ||
               [ -z "$main_activity" ] || [ ! -f android/gradlew ]; then
              echo "Incomplete Android scaffold detected; regenerating with Flutter stable."
              cp android/app/src/main/AndroidManifest.xml /tmp/darb-AndroidManifest.xml
              had_widget_test=false
              if [ -f test/widget_test.dart ]; then had_widget_test=true; fi
              flutter create --platforms=android --project-name darb --org com.darb .
              cp /tmp/darb-AndroidManifest.xml android/app/src/main/AndroidManifest.xml
              if [ "$had_widget_test" = false ]; then
                rm -f test/widget_test.dart
                rmdir test 2>/dev/null || true
              fi
            fi

            test -f android/gradlew
            test -f android/app/build.gradle -o -f android/app/build.gradle.kts
            main_activity="$(find android/app/src/main -type f | grep -E 'MainActivity[.]kt$|MainActivity[.]java$' | head -n 1 || true)"
            test -n "$main_activity"
            grep -Fq 'io.flutter.embedding.android.FlutterActivity' "$main_activity"
            grep -q 'android:name="flutterEmbedding" android:value="2"' android/app/src/main/AndroidManifest.xml

            mkdir -p android/app/src/main/res/drawable android/app/src/main/res/mipmap-anydpi-v26
            cp "$GITHUB_WORKSPACE/mobile-overrides/ic_launcher.xml" android/app/src/main/res/drawable/darb_launcher_foreground.xml
            cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@android:color/white" />
              <foreground android:drawable="@drawable/darb_launcher_foreground" />
          </adaptive-icon>
          XML
            echo "Installed DARB adaptive launcher icon."

            python3 - <<'PY'
          from pathlib import Path
          p = Path("pubspec.yaml")
          s = p.read_text()
          if "google_sign_in:" not in s:
              s = s.replace("  flutter_localizations:\n    sdk: flutter\n", "  flutter_localizations:\n    sdk: flutter\n  google_sign_in: ^6.2.1\n")
          p.write_text(s)
          PY
          flutter pub get
            if ! flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings; then
              echo "::group::Dart syntax context: app_shell.dart lines 25-33"
              nl -ba lib/screens/app_shell.dart | sed -n '25,33p' | fold -w 160
              echo "::endgroup::"
              exit 1
            fi
            echo "Static analysis passed. Installable APKs are produced only by the signed release workflow."
            echo "::endgroup::"
          done

      # Deliberately no APK artifact here: this workflow validates source only.\n      # Installable builds are published only by build-android-release.yml.\n
